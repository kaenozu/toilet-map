name: Repair issue 143 filter semantics

on:
  push:
    branches: [agent/fix-filter-unknowns-143]
    paths: [.github/workflows/repair-issue143-filter-semantics.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-filter-unknowns-143
      - name: Patch public API filter semantics
        shell: python
        run: |
          from pathlib import Path
          path = Path('v2/backend/app/public_api.py')
          text = path.read_text(encoding='utf-8')
          marker = '''def _boolean_attribute(conditions: list[str], key: str, value: bool | None, params: list[object]) -> None:
    if value is None:
        return
    truthy = "lower(COALESCE(p.attributes->>%s, '')) IN ('yes', 'true', 'designated', '1')"
    conditions.append(truthy if value else f"NOT ({truthy})")
    params.append(key)


'''
          helpers = marker + '''def _minimum_score_condition(include_unscored: bool | None) -> str:
    clause = "p.toilet_score >= %s"
    if include_unscored is True:
        return f"({clause} OR p.toilet_score IS NULL)"
    return clause


def _fee_condition(value: bool) -> str:
    explicit_values = "('yes', 'true', '1', 'paid')" if value else "('no', 'false', '0', 'free')"
    return f"lower(p.attributes->>'fee') IN {explicit_values}"


'''
          if text.count(marker) != 1:
              raise SystemExit(f'helper marker count={text.count(marker)}')
          text = text.replace(marker, helpers, 1)
          text = text.replace('    include_unscored: bool = True,\n', '    include_unscored: bool | None = None,\n', 1)
          old = '''    if min_score is not None:
        clause = "p.toilet_score >= %s"
        if include_unscored:
            clause = f"({clause} OR p.toilet_score IS NULL)"
        conditions.append(clause)
        params.append(min_score)
    elif not include_unscored:
        conditions.append("p.toilet_score IS NOT NULL")
'''
          new = '''    if min_score is not None:
        conditions.append(_minimum_score_condition(include_unscored))
        params.append(min_score)
    elif include_unscored is False:
        conditions.append("p.toilet_score IS NOT NULL")
'''
          if text.count(old) != 1:
              raise SystemExit(f'score block count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''    if fee is not None:
        conditions.append(
            "lower(COALESCE(p.attributes->>'fee', 'no')) IN ('yes', 'true', '1')"
            if fee
            else "lower(COALESCE(p.attributes->>'fee', 'no')) NOT IN ('yes', 'true', '1')"
        )
'''
          new = '''    if fee is not None:
        conditions.append(_fee_condition(fee))
'''
          if text.count(old) != 1:
              raise SystemExit(f'fee block count={text.count(old)}')
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/repair-issue143-filter-semantics.yml').unlink()
      - name: Validate backend
        run: |
          python -m pip install uv
          uv run --python 3.13 --project v2/backend --extra dev ruff check v2/backend/app/public_api.py v2/backend/tests/test_public_filters.py
          uv run --python 3.13 --project v2/backend --extra dev pytest -q v2/backend/tests/test_public_filters.py
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/backend/app/public_api.py .github/workflows/repair-issue143-filter-semantics.yml
          git diff --cached --check
          git commit -m 'fix: exclude unknown score and fee values'
          git push origin HEAD:agent/fix-filter-unknowns-143
