name: Repair issue 143 filter semantics

on:
  push:
    branches: [agent/fix-filter-unknowns-143]
    paths: [.github/workflows/repair-issue143-filter-semantics.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-filter-unknowns-143
      - name: Apply filter repair
        run: python tools/repair_issue143.py
      - name: Validate backend
        run: |
          python -m pip install uv
          uv run --python 3.13 --project v2/backend --extra dev ruff check v2/backend/app/public_api.py v2/backend/tests/test_public_filters.py
          uv run --python 3.13 --project v2/backend --extra dev pytest -q v2/backend/tests/test_public_filters.py
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/backend/app/public_api.py tools/repair_issue143.py .github/workflows/repair-issue143-filter-semantics.yml
          git diff --cached --check
          git commit -m 'fix: exclude unknown score and fee values'
          git push origin HEAD:agent/fix-filter-unknowns-143
