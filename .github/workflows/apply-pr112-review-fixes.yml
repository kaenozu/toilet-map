name: Apply PR 112 review fixes

on:
  push:
    branches: [agent/osm-scoring-ingestion]

permissions:
  contents: write

concurrency:
  group: apply-pr112-review-fixes
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/osm-scoring-ingestion
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply deterministic text fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('v2/frontend/tests/e2e/dashboard-desktop.spec.ts')
          text = dashboard.read_text()
          text = text.replace(
              'const PLACES_RESPONSE = {\n  items:',
              'const PLACES_RESPONSE = {\n  total: 3,\n  items:',
              1,
          )
          dashboard.write_text(text)

          pipeline = Path('v2/backend/tests/integration/test_publish_pipeline.py')
          text = pipeline.read_text()
          text = text.replace(
              'JOIN places p ON p.id = pr.place_id',
              'LEFT JOIN places p ON p.id = pr.place_id',
              1,
          )
          text = text.replace(
              'assert row["trust_score"] >= 0',
              'assert row["trust_score"] > 0',
              1,
          )
          pipeline.write_text(text)

          workflow = Path('.github/workflows/v2-ci.yml')
          text = workflow.read_text()
          marker = '''      - run: pytest -v -m integration
          working-directory: v2/backend
'''
          replacement = marker + '''      - name: Explicitly verify migration and publication guards
        working-directory: v2/backend
        run: >-
          pytest -v
          tests/integration/test_publish_pipeline.py::TestMigrations::test_all_migrations_applied
          tests/integration/test_publish_pipeline.py::TestPipeline::test_validate_then_publish
'''
          if replacement not in text:
              text = text.replace(marker, replacement, 1)
          workflow.write_text(text)
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            v2/frontend/tests/e2e/dashboard-desktop.spec.ts \
            v2/backend/tests/integration/test_publish_pipeline.py \
            .github/workflows/v2-ci.yml
          git commit -m 'test: address remaining nationwide ingestion review findings'
          git push origin HEAD:agent/osm-scoring-ingestion
