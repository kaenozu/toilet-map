name: Weekly Data Quality Report
on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 09:00 UTC
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Generate report
        id: report
        run: |
          python -c "
import sqlite3, json, datetime
from app_config import DB_PATH

conn = sqlite3.connect(DB_PATH)
total = conn.execute('SELECT COUNT(*) FROM toilets').fetchone()[0]
scored = conn.execute('SELECT COUNT(*) FROM toilets WHERE score IS NOT NULL').fetchone()[0]
no_address = conn.execute(\"SELECT COUNT(*) FROM toilets WHERE address IS NULL OR address = ''\").fetchone()[0]
no_reviews = conn.execute('SELECT COUNT(*) FROM toilets WHERE review_count IS NULL OR review_count = 0').fetchone()[0]
row = conn.execute(\"SELECT value FROM metadata WHERE key='last_updated'\").fetchone()
last_updated = row[0] if row else 'unknown'

# Prefecture distribution
prefs = conn.execute('SELECT prefecture, COUNT(*) as cnt FROM toilets GROUP BY prefecture ORDER BY cnt DESC LIMIT 5').fetchall()

report = f'''## 📊 Weekly Data Quality Report
**Generated**: {datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}

### Overview
- **Total toilets**: {total}
- **Scored**: {scored} ({\"%.1f\" % (scored/total*100) if total else 0}%)
- **Missing address**: {no_address}
- **Zero reviews**: {no_reviews}
- **Last updated**: {last_updated}

### Top 5 Prefectures
'''
for p in prefs:
    report += f\"- {p[0]}: {p[1]} toilets\\n\"

conn.close()
with open('report.md', 'w') as f:
    f.write(report)
print('Report saved to report.md')
"
          echo "report_body<<EOF" >> $GITHUB_OUTPUT
          cat report.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create Issue
        uses: dacbd/create-issue@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: '📊 Data Quality Report - ${{ github.event.repository.updated_at }}'
          body: ${{ steps.report.outputs.report_body }}
          labels: data-quality, automated
