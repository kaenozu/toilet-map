name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: pip install ruff
      - name: Capture Ruff output
        id: ruff
        shell: bash
        run: |
          set +e
          ruff check . --output-format=concise 2>&1 | tee ruff-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Ruff output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-output
          path: ruff-output.txt
      - name: Enforce Ruff
        if: steps.ruff.outputs.status != '0'
        run: exit 1

  test:
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Capture dependency installation
        id: dependencies
        shell: bash
        run: |
          set +e
          {
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          } 2>&1 | tee dependency-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload dependency output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-output-${{ matrix.python-version }}
          path: dependency-output.txt
      - name: Enforce dependency installation
        if: steps.dependencies.outputs.status != '0'
        run: exit 1
      - name: Type check with mypy
        run: mypy app.py app_config.py ui/ batch/ --ignore-missing-imports --follow-imports=silent
      - name: Capture test output
        id: pytest
        shell: bash
        run: |
          rm -f .coverage*
          set +e
          pytest tests/ -v --tb=short --cov=. --cov-report=term-missing 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ matrix.python-version }}
          path: pytest-output.txt
      - name: Enforce tests
        if: steps.pytest.outputs.status != '0'
        run: exit 1
      - name: Run data verification
        run: python batch/verify_data.py

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
      - name: Build Streamlit app
        run: |
          streamlit run app.py &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo "Streamlit app started successfully"
              exit 0
            fi
            sleep 2
          done
          echo "Streamlit app failed to start within 60 seconds" && exit 1

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t toilet-map:ci .
