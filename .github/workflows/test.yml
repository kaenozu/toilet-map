name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install tools
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check .
      - name: Check formatting of changed Python files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          mapfile -t changed_python_files < <(
            git diff --name-only --diff-filter=ACMRT "$base_sha" HEAD -- '*.py'
          )

          if (( ${#changed_python_files[@]} == 0 )); then
            echo "No changed Python files to format-check."
            exit 0
          fi

          printf 'Checking formatting for:\n%s\n' "${changed_python_files[*]}"
          ruff format --check "${changed_python_files[@]}"

  test:
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Capture mypy output
        id: mypy
        shell: bash
        run: |
          set +e
          mypy app.py app_config.py ui/ batch/ --ignore-missing-imports --follow-imports=silent 2>&1 | tee mypy-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload mypy output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-output-${{ matrix.python-version }}
          path: mypy-output.txt
      - name: Enforce mypy
        if: steps.mypy.outputs.status != '0'
        run: exit 1
      - name: Run tests with coverage
        run: |
          rm -f .coverage*
          pytest tests/ -v --tb=short --cov=. --cov-report=term-missing
      - name: Run data verification
        run: python batch/verify_data.py

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
      - name: Build Streamlit app
        run: |
          streamlit run app.py &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo "Streamlit app started successfully"
              exit 0
            fi
            sleep 2
          done
          echo "Streamlit app failed to start within 60 seconds" && exit 1

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t toilet-map:ci .
