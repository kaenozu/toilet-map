name: Test

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint tools
        run: pip install ruff

      - name: Lint with ruff check
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Type check with mypy
        run: mypy app.py app_config.py ui/ --ignore-missing-imports --follow-imports=silent

      - name: Run tests with coverage
        run: |
          rm -f .coverage*
          pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-fail-under=70

      - name: Run data verification
        run: python batch/verify_data.py

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Streamlit app
        run: |
          streamlit run app.py &
          for i in $(seq 1 30); do
            if curl -s http://localhost:8501 | grep -q "Streamlit"; then
              echo "Streamlit app started successfully"
              exit 0
            fi
            sleep 2
          done
          echo "Streamlit app failed to start within 60 seconds" && exit 1
        shell: bash
