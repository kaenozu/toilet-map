name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install tools
        run: pip install ruff pre-commit
      - name: Lint with ruff
        run: ruff check .
      - name: Check formatting
        run: pre-commit run ruff-format --all-files --show-diff-on-failure
      - name: Type-check pre-commit hook
        run: pre-commit run mypy --all-files --show-diff-on-failure

  test:
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Type check with mypy
        run: mypy app.py app_config.py ui/ batch/ --ignore-missing-imports --follow-imports=silent
      - name: Run tests with coverage
        run: |
          rm -f .coverage*
          pytest tests/ -v --tb=short --cov=. --cov-report=term-missing
      - name: Run data verification
        run: python batch/verify_data.py

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
      - name: Build Streamlit app
        run: |
          streamlit run app.py &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo "Streamlit app started successfully"
              exit 0
            fi
            sleep 2
          done
          echo "Streamlit app failed to start within 60 seconds" && exit 1

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t toilet-map:ci .
