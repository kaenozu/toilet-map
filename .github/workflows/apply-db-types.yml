name: Apply shared database typing

on:
  push:
    branches: [agent/osm-scoring-ingestion]

permissions:
  contents: write

concurrency:
  group: apply-db-types
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/osm-scoring-ingestion
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Unify dictionary-row connection annotations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = [
              'v2/backend/app/entities.py',
              'v2/backend/app/importer.py',
              'v2/backend/app/ingestion.py',
              'v2/backend/app/job_queue.py',
              'v2/backend/app/migrations.py',
              'v2/backend/app/reports.py',
              'v2/backend/app/resolution.py',
              'v2/backend/app/score_storage.py',
          ]

          for name in targets:
              path = Path(name)
              text = path.read_text()
              text = re.sub(r'from psycopg import Connection, ([^\n]+)', r'from psycopg import \1\nfrom .db_types import DbConnection', text)
              text = text.replace('from psycopg import Connection\n', 'from .db_types import DbConnection\n')
              text = re.sub(r'\bConnection\b', 'DbConnection', text)
              text = text.replace('from psycopg import DbConnection\n', 'from .db_types import DbConnection\n')
              text = text.replace('from psycopg import DbConnection, ', 'from psycopg import ')
              if 'DbConnection' in text and 'from .db_types import DbConnection' not in text:
                  lines = text.splitlines()
                  insert_at = next((i for i, line in enumerate(lines) if line.startswith('from .')), len(lines))
                  lines.insert(insert_at, 'from .db_types import DbConnection')
                  text = '\n'.join(lines) + ('\n' if path.read_text().endswith('\n') else '')
              path.write_text(text)

          db = Path('v2/backend/app/db.py')
          text = db.read_text()
          text = text.replace('from psycopg import Connection, connect', 'from typing import cast\n\nfrom psycopg import connect')
          text = text.replace('from psycopg.rows import DictRow, dict_row', 'from psycopg.rows import dict_row')
          text = text.replace('from .migrations import apply_migrations', 'from .db_types import DbConnection\nfrom .migrations import apply_migrations')
          text = text.replace('def database() -> Iterator[Connection[DictRow]]:', 'def database() -> Iterator[DbConnection]:')
          text = text.replace('connection: Connection[DictRow] = connect(', 'connection = cast(DbConnection, connect(')
          text = text.replace('        row_factory=dict_row,\n    )\n    with connection:', '        row_factory=dict_row,\n    ))\n    with connection:')
          db.write_text(text)
          PY
          python -m compileall -q v2/backend/app
          git rm .github/workflows/apply-db-types.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/backend/app
          git commit -m 'refactor: unify psycopg dict-row connection types'
          git push origin HEAD:agent/osm-scoring-ingestion
