name: Repair issue 141 job lease fencing

on:
  push:
    branches: [agent/fix-job-lease-fencing-141]
    paths: [.github/workflows/repair-issue141-job-fencing.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-job-lease-fencing-141
      - name: Apply lease repair
        run: python tools/repair_issue141.py
      - name: Validate backend safety surface
        run: |
          python -m pip install uv
          uv run --python 3.13 --project v2/backend --extra dev ruff check v2/backend/app/job_queue.py v2/backend/app/worker.py v2/backend/tests/test_job_queue.py v2/backend/tests/test_job_lease_fencing.py
          uv run --python 3.13 --project v2/backend --extra dev pytest -q v2/backend/tests/test_job_queue.py v2/backend/tests/test_job_lease_fencing.py
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/backend/app/job_queue.py v2/backend/app/worker.py tools/repair_issue141.py .github/workflows/repair-issue141-job-fencing.yml
          git diff --cached --check
          git commit -m 'fix: heartbeat and fence job leases'
          git push origin HEAD:agent/fix-job-lease-fencing-141
