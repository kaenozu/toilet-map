name: V2 Release

on:
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: v2-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/toilet-map-v2

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: v2/backend
            image: api
          - name: frontend
            context: v2/frontend
            image: web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  summary:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - run: |
          echo "Published API and frontend images for $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker uses the same backend image with command: python -m app.worker" >> "$GITHUB_STEP_SUMMARY"
