name: Repair issue 140 FastAPI defaults

on:
  push:
    branches: [agent/fix-closed-publication-140]
    paths:
      - tools/repair_issue140_annotated.py
      - .github/workflows/repair-issue140-annotated.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-closed-publication-140
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply repair
        run: python tools/repair_issue140_annotated.py
      - name: Validate backend
        run: |
          pip install './v2/backend[dev]'
          ruff check v2/backend/app/public_api.py
          python -m compileall -q v2/backend/app
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: use plain defaults for FastAPI query parameters'
          git push origin HEAD:agent/fix-closed-publication-140
