name: Repair issue 140 public API filtering

on:
  push:
    branches: [agent/fix-closed-publication-140]
    paths: [.github/workflows/repair-issue140-public-api.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-closed-publication-140
      - name: Apply public API repair
        run: python tools/repair_issue140.py
      - name: Validate source
        run: |
          python -m pip install uv
          uv run --python 3.13 --project v2/backend --extra dev ruff check v2/backend/app/public_api.py
          uv run --python 3.13 --project v2/backend --extra dev python -m compileall -q v2/backend/app
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/backend/app/public_api.py tools/repair_issue140.py .github/workflows/repair-issue140-public-api.yml
          git diff --cached --check
          git commit -m 'fix: hide non-active facilities from public API'
          git push origin HEAD:agent/fix-closed-publication-140
