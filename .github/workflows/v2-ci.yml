# v2 backend, frontend, schema, and container validation.
name: V2 CI

on:
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'

concurrency:
  group: v2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ruff==0.12.4
      - name: Capture Ruff output
        id: ruff
        shell: bash
        run: |
          set +e
          ruff check v2/backend --output-format=concise 2>&1 | tee v2-ruff-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Ruff output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-ruff-output
          path: v2-ruff-output.txt
      - name: Enforce Ruff
        if: steps.ruff.outputs.status != '0'
        run: exit 1

  backend:
    needs: backend-lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: toilet_map
          POSTGRES_USER: toilet_map
          POSTGRES_PASSWORD: toilet_map
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toilet_map -d toilet_map"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://toilet_map:toilet_map@localhost:5432/toilet_map
      ADMIN_API_KEY: ci-key
      PUBLIC_READ_MODEL: snapshot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install './v2/backend[dev]'
      - run: pytest -q -m "not integration"
        working-directory: v2/backend
      - run: pyright app/
        working-directory: v2/backend
      - run: pytest -v -m integration
        working-directory: v2/backend
      - name: Verify psql bootstrap is idempotent
        working-directory: v2/backend
        env:
          PGPASSWORD: toilet_map
        run: |
          psql --version
          psql -h localhost -U toilet_map -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS toilet_map_schema_test'
          psql -h localhost -U toilet_map -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE toilet_map_schema_test'
          psql -h localhost -U toilet_map -d toilet_map_schema_test -v ON_ERROR_STOP=1 -f schema.sql
          psql -h localhost -U toilet_map -d toilet_map_schema_test -v ON_ERROR_STOP=1 -f schema.sql
          psql -h localhost -U toilet_map -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE toilet_map_schema_test'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Upload frontend UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-frontend-ui-evidence
          path: |
            v2/frontend/playwright-report/
            v2/frontend/test-results/

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f v2/docker-compose.yml config
      - run: docker compose -f v2/docker-compose.yml build
