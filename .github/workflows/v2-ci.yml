# v2 backend, frontend, schema, and container validation.
name: V2 CI

on:
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'

concurrency:
  group: v2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ruff==0.12.4
      - name: Capture Ruff output
        id: ruff
        shell: bash
        run: |
          set +e
          ruff check v2/backend --output-format=concise 2>&1 | tee v2-ruff-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Ruff output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-ruff-output
          path: v2-ruff-output.txt
      - name: Enforce Ruff
        if: steps.ruff.outputs.status != '0'
        run: exit 1

  backend:
    needs: backend-lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: toilet_map
          POSTGRES_USER: toilet_map
          POSTGRES_PASSWORD: toilet_map
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toilet_map -d toilet_map"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://toilet_map:toilet_map@localhost:5432/toilet_map
      ADMIN_API_KEY: ci-key
      PUBLIC_READ_MODEL: snapshot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install './v2/backend[dev]'
      - run: pytest -q
        working-directory: v2/backend
      - name: Apply versioned migrations twice
        working-directory: v2/backend
        run: |
          python -m app.cli init-db
          python -m app.cli init-db
          python - <<'PY'
          from app.db import database
          with database() as connection:
              rows = connection.execute(
                  "SELECT version FROM schema_migrations ORDER BY version"
              ).fetchall()
          assert [row['version'] for row in rows] == ['0001', '0002', '0003', '0004', '0005']
          PY
      - name: Verify psql bootstrap is idempotent
        working-directory: v2/backend
        env:
          PGPASSWORD: toilet_map
        run: |
          psql --version
          psql -h localhost -U toilet_map -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS toilet_map_schema_test'
          psql -h localhost -U toilet_map -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE toilet_map_schema_test'
          psql -h localhost -U toilet_map -d toilet_map_schema_test -v ON_ERROR_STOP=1 -f schema.sql
          psql -h localhost -U toilet_map -d toilet_map_schema_test -v ON_ERROR_STOP=1 -f schema.sql
          psql -h localhost -U toilet_map -d postgres -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE toilet_map_schema_test'
      - name: Verify ingestion, publication guard, snapshots, and facility status
        working-directory: v2/backend
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          from fastapi import HTTPException
          from app.db import database
          from app.importer import import_legacy
          from app.public_api import get_place, list_places, stats
          from app.worker import validate_dataset, publish_dataset
          fixture = Path('/tmp/toilets.json.gz')
          with gzip.open(fixture, 'wt', encoding='utf-8') as handle:
              json.dump({'metadata': {'snapshot_id': 'ci'}, 'toilets': [
                  {
                      'place_id': 'ci-1',
                      'name': 'CI Toilet',
                      'latitude': 35.0,
                      'longitude': 139.0,
                      'toilet_score': 80,
                      'wheelchair': 'yes',
                      'changing_table': 'yes',
                      'opening_hours': '24/7',
                      'reviews': ['清潔で車椅子用の手すりがあります'],
                  },
                  {
                      'place_id': 'ci-2',
                      'name': 'CI Closed Toilet',
                      'latitude': 35.01,
                      'longitude': 139.01,
                      'toilet_score': 70,
                      'wheelchair': 'no',
                      'changing_table': 'no',
                      'opening_hours': '09:00-18:00',
                      'reviews': [],
                  },
              ]}, handle)
          dataset_id, count = import_legacy(fixture, source='ci')
          assert count == 2
          validate_dataset(dataset_id)
          with database() as connection:
              connection.execute(
                  "UPDATE facility_source_links SET status = 'pending' "
                  "WHERE source_record_id IN (SELECT source_record_id FROM places WHERE dataset_version_id = %s)",
                  (dataset_id,),
              )
              connection.commit()
          try:
              publish_dataset(dataset_id)
          except Exception as exc:
              assert 'unresolved canonical records' in str(exc)
          else:
              raise AssertionError('publication must reject a post-validation unresolved link')
          with database() as connection:
              state = connection.execute(
                  "SELECT status::text AS status FROM dataset_versions WHERE id = %s", (dataset_id,)
              ).fetchone()
              snapshots = connection.execute(
                  "SELECT count(*) AS total FROM published_place_snapshots WHERE dataset_version_id = %s",
                  (dataset_id,),
              ).fetchone()
              assert state['status'] == 'validated'
              assert snapshots['total'] == 0
              connection.execute(
                  "UPDATE facility_source_links SET status = 'matched' "
                  "WHERE source_record_id IN (SELECT source_record_id FROM places WHERE dataset_version_id = %s)",
                  (dataset_id,),
              )
              connection.commit()
          publish_dataset(dataset_id)
          with database() as connection:
              counts = connection.execute(
                  '''
                  SELECT
                    (SELECT count(*) FROM facilities) AS facilities,
                    (SELECT count(*) FROM source_records WHERE dataset_version_id = %s) AS source_records,
                    (SELECT count(*) FROM facility_source_links WHERE status = 'matched') AS matched_links,
                    (SELECT count(*) FROM published_place_snapshots WHERE dataset_version_id = %s) AS snapshots,
                    (SELECT count(*) FROM dimension_observations) AS observations,
                    (SELECT count(*) FROM facility_scores) AS dimension_scores,
                    (SELECT min(trust_score) FROM published_place_snapshots WHERE dataset_version_id = %s) AS trust_score
                  ''',
                  (dataset_id, dataset_id, dataset_id),
              ).fetchone()
              closed_place = connection.execute(
                  "SELECT id, facility_id FROM places WHERE dataset_version_id = %s AND name = 'CI Closed Toilet'",
                  (dataset_id,),
              ).fetchone()
          assert counts['facilities'] == 2
          assert counts['source_records'] == 2
          assert counts['matched_links'] == 2
          assert counts['snapshots'] == 2
          assert counts['observations'] == 4
          assert counts['dimension_scores'] == 4
          assert counts['trust_score'] is not None
          assert closed_place is not None

          with database() as connection:
              connection.execute(
                  "UPDATE facilities SET status = 'closed', updated_at = now() WHERE id = %s",
                  (closed_place['facility_id'],),
              )
              connection.commit()

          public = list_places()
          assert public['total'] == 1
          assert [item['name'] for item in public['items']] == ['CI Toilet']
          assert stats()['record_count'] == 1
          try:
              get_place(int(closed_place['id']))
          except HTTPException as exc:
              assert exc.status_code == 404
          else:
              raise AssertionError('closed facility must disappear from detail API immediately')

          with database() as connection:
              connection.execute(
                  "UPDATE dataset_versions SET status = 'validated' WHERE id = %s",
                  (dataset_id,),
              )
              connection.commit()
          publish_dataset(dataset_id)
          with database() as connection:
              republished = connection.execute(
                  "SELECT count(*) AS total FROM published_place_snapshots WHERE dataset_version_id = %s",
                  (dataset_id,),
              ).fetchone()
              closed_snapshot = connection.execute(
                  "SELECT count(*) AS total FROM published_place_snapshots WHERE dataset_version_id = %s AND facility_id = %s",
                  (dataset_id, closed_place['facility_id']),
              ).fetchone()
              published_count = connection.execute(
                  "SELECT record_count FROM dataset_versions WHERE id = %s",
                  (dataset_id,),
              ).fetchone()
          assert republished['total'] == 1
          assert closed_snapshot['total'] == 0
          assert published_count['record_count'] == 1
          assert list_places()['total'] == 1
          PY
      - name: API smoke test
        working-directory: v2/backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          server=$!
          trap 'kill $server' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:8000/api/v2/places?wheelchair=true&min_trust=1' | grep 'CI Toilet'
          curl -fsS -H 'X-Admin-Key: ci-key' http://127.0.0.1:8000/api/v2/admin/data-quality | grep 'migrations'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Upload frontend UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-frontend-ui-evidence
          path: |
            v2/frontend/playwright-report/
            v2/frontend/test-results/

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f v2/docker-compose.yml config
      - run: docker compose -f v2/docker-compose.yml build
