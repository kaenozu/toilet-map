name: DB Backup
on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 04:00 UTC
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python batch/backup_db.py
      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: data/backups/
