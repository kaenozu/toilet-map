name: Apply CI fixes from PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/main-ci-green
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Execute embedded fix script
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/export-source.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<embedded-ci-fix>', 'exec'))
          Path('.github/workflows/apply-ci-fixes-pr.yml').unlink()
          PY
      - name: Verify focused tests
        run: |
          python -m py_compile batch/pipeline.py batch/process_data.py batch/scoring.py tests/test_pipeline.py tests/test_batch_scrape_pipeline.py
          python -m pytest tests/test_pipeline.py tests/test_batch_scrape_pipeline.py::TestPostProcessPipeline::test_run_postprocess_pipeline_converts_sqlite_incrementally tests/test_process_data.py::TestMakePlaceKey tests/test_process_data.py::TestExtractCoordinates::test_longitude_zero_falls_back_to_longtitude -q
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: restore CI test contracts"
          git push origin HEAD:fix/main-ci-green
