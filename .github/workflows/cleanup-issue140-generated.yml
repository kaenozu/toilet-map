name: Cleanup issue 140 generated files

on:
  push:
    branches: [agent/fix-closed-publication-140]
    paths:
      - .github/workflows/cleanup-issue140-generated.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-closed-publication-140
      - name: Remove generated packaging artifacts
        run: |
          rm -rf v2/backend/build v2/backend/toilet_map_v2_backend.egg-info
          rm -f .github/workflows/cleanup-issue140-generated.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: remove generated backend packaging artifacts'
          git push origin HEAD:agent/fix-closed-publication-140
