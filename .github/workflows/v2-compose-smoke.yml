# Validate that a clean Docker Compose environment can initialize, import, and serve v2.
name: V2 Compose Smoke

on:
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-compose-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-compose-smoke.yml'

concurrency:
  group: v2-compose-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Analyze canonical identity collisions
        shell: bash
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          import json
          from collections import defaultdict
          from pathlib import Path

          path = Path("data/toilets.json.gz")
          with gzip.open(path, "rt", encoding="utf-8") as handle:
              payload = json.load(handle)
          records = payload.get("toilets", []) if isinstance(payload, dict) else payload

          def first(record, *keys):
              for key in keys:
                  value = record.get(key)
                  if value is not None and value != "":
                      return value
              return None

          def stable_key(record):
              explicit = first(record, "stable_key", "source_id", "place_id", "data_id", "id")
              if explicit is not None:
                  return str(explicit)
              canonical = "|".join(
                  str(first(record, key) or "")
                  for key in ("name", "address", "latitude", "longitude")
              )
              return hashlib.sha256(canonical.encode("utf-8")).hexdigest()[:32]

          groups = defaultdict(list)
          for index, record in enumerate(records):
              if isinstance(record, dict):
                  groups[stable_key(record)].append((index, record))

          collisions = []
          for key, items in groups.items():
              if len(items) < 2:
                  continue
              collision_records = []
              for index, record in items:
                  canonical = json.dumps(record, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
                  collision_records.append({
                      "index": index,
                      "record_hash": hashlib.sha256(canonical.encode("utf-8")).hexdigest(),
                      "source_id": record.get("source_id"),
                      "place_id": record.get("place_id"),
                      "data_id": record.get("data_id"),
                      "id": record.get("id"),
                      "name": record.get("name") or record.get("title"),
                      "address": record.get("address"),
                      "latitude": record.get("latitude") or record.get("lat"),
                      "longitude": record.get("longitude") or record.get("lng"),
                      "review_count": record.get("review_count") or record.get("user_ratings_total"),
                      "reviews": len(record.get("reviews") or record.get("sample_reviews") or []),
                  })
              collisions.append({"stable_key": key, "records": collision_records})

          diagnostics = {
              "record_count": len(records),
              "collision_key_count": len(collisions),
              "colliding_record_count": sum(len(item["records"]) for item in collisions),
              "collisions": collisions,
          }
          Path("v2-identity-collisions.json").write_text(
              json.dumps(diagnostics, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({key: diagnostics[key] for key in diagnostics if key != "collisions"}))
          PY
      - name: Upload identity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-identity-collisions
          path: v2-identity-collisions.json
          if-no-files-found: error
      - name: Validate Compose configuration
        run: docker compose -f v2/docker-compose.yml config --quiet
      - name: Build images
        run: docker compose -f v2/docker-compose.yml build --quiet
      - name: Start clean PostgreSQL/PostGIS
        run: docker compose -f v2/docker-compose.yml up -d db
      - name: Import and publish the canonical dataset
        shell: bash
        run: |
          set +e
          docker compose -f v2/docker-compose.yml --profile tools run --rm migrate \
            >v2-compose-migrate.log 2>&1
          status=$?
          tail -n 100 v2-compose-migrate.log
          exit "$status"
      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-compose-migrate-log
          path: v2-compose-migrate.log
          if-no-files-found: error
      - name: Start backend and frontend
        run: docker compose -f v2/docker-compose.yml up -d backend frontend
      - name: Verify backend health and published data
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS 'http://127.0.0.1:8000/api/v2/places?limit=1' \
            | python -c 'import json, sys; payload = json.load(sys.stdin); assert payload["total"] > 0; assert payload["items"]'
      - name: Verify frontend
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000 >/dev/null
      - name: Show container logs
        if: failure()
        run: docker compose -f v2/docker-compose.yml logs --no-color --tail=100
      - name: Clean up Compose resources
        if: always()
        run: docker compose -f v2/docker-compose.yml down -v --remove-orphans
