# Validate that a clean Docker Compose environment can initialize, import, and serve v2.
name: V2 Compose Smoke

on:
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-compose-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-compose-smoke.yml'

concurrency:
  group: v2-compose-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose -f v2/docker-compose.yml config
      - name: Build images
        run: docker compose -f v2/docker-compose.yml build
      - name: Start from an empty database and serve imported data
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f v2/docker-compose.yml)
          cleanup() {
            "${compose[@]}" logs --no-color || true
            "${compose[@]}" down -v --remove-orphans || true
          }
          trap cleanup EXIT

          "${compose[@]}" up -d db
          "${compose[@]}" --profile tools run --rm migrate
          "${compose[@]}" up -d backend frontend

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS 'http://127.0.0.1:8000/api/v2/places?limit=1' \
            | python -c 'import json, sys; payload = json.load(sys.stdin); assert payload["total"] > 0; assert payload["items"]'

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000 >/dev/null
