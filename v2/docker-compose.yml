services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: toilet_map
      POSTGRES_USER: toilet_map
      POSTGRES_PASSWORD: toilet_map
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toilet_map -d toilet_map"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - toilet-map-db:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://toilet_map:toilet_map@db:5432/toilet_map
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://toilet_map:toilet_map@db:5432/toilet_map
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  toilet-map-db:
