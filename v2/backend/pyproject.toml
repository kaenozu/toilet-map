[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "toilet-map-v2-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "psycopg[binary]==3.2.9",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "httpx==0.28.1", "ruff==0.12.4", "pyright==1.1.400"]

[project.scripts]
toilet-map-v2 = "app.cli:main"
toilet-map-worker = "app.worker:run_forever"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]

[tool.pyright]
include = ["app"]
exclude = ["tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires a real PostgreSQL database (DATABASE_URL)",
    "slow: test that takes longer than a few seconds to run",
]
