[tool.pytest.ini_options]
pythonpath = [
  ".",
  "batch"
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "**/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 120

[project]
name = "toilet-map"
version = "1.0.0"
description = "Google Maps のレビューからトイレのきれい度を自動判定して地図上に表示する Streamlit アプリ"
requires-python = ">=3.11"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM"]
ignore = ["E501"]
